name: Deploy Payment Lab

on:
  push:
    branches: ["master"]
    paths:
      - "payment-platform/src/main/resources/static/**"
      - ".github/workflows/payment-lab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static lab
        uses: actions/upload-pages-artifact@v3
        with:
          path: payment-platform/src/main/resources/static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
