name: Payment Platform CI

on:
  push:
    branches: ["master", "feat/**"]
    paths:
      - "payment-platform/**"
      - ".github/workflows/payment-platform-ci.yml"
  pull_request:
    paths:
      - "payment-platform/**"
      - ".github/workflows/payment-platform-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: payment-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: payment-platform/pom.xml
      - name: Verify
        run: mvn --batch-mode verify
